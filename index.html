<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anaya Arcade</title>
    <!-- Telegram & Adsgram SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #121212; color: white; padding: 15px; margin: 0; }
        h2 { color: #f1c40f; margin-bottom: 15px; }
        .card { background: #1e1e1e; padding: 18px; border-radius: 12px; margin: 12px auto; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .coin-box { font-size: 26px; font-weight: bold; color: #f1c40f; margin-top: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 8px; transition: 0.2s; }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-ad { background: #e67e22; }
        .btn-task { background: #2980b9; }
        input, select { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: white; font-size: 14px; text-align: center; }
        
        /* Graphical Wheel CSS */
        .wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 10px auto; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #e74c3c; z-index: 10; }
        canvas { border-radius: 50%; border: 5px solid #f1c40f; box-shadow: 0 0 15px #f1c40f; }
    </style>
</head>
<body>

    <h2>🎰 Anaya Arcade</h2>

    <!-- Coin Balance Card -->
    <div class="card">
        <div>Total Balance</div>
        <div class="coin-box">🪙 <span id="coins">0</span> Coins</div>
    </div>

    <!-- Graphical Spin Wheel Section -->
    <div class="card">
        <h3>🎡 Spin & Win</h3>
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="250" height="250"></canvas>
        </div>
        <button id="spinBtn" onclick="spinWheel()">Spin Wheel</button>
    </div>

    <!-- Tasks & Monetization Section -->
    <div class="card">
        <h3>💬 Chat & Earn</h3>
        <p style="font-size: 13px; color: #bbb;">Chat with Anaya and earn bonus coins!</p>
        <button class="btn-task" onclick="doChatTask()">💬 Chat with Anaya (+80 Coins)</button>
    </div>

    <div class="card">
        <h3>📺 Watch Ads</h3>
        <button class="btn-ad" onclick="showRewardAd()">Watch Ad (+50 Coins)</button>
    </div>

    <!-- Multi-Method Withdrawal Section -->
    <div class="card">
        <h3>💸 Request Withdrawal</h3>
        <select id="withdrawMethod" onchange="updatePlaceholder()">
            <option value="UPI">UPI Transfer</option>
            <option value="Amazon Voucher">Amazon Gift Card</option>
            <option value="PlayStore Redeem Code">Google Play Redeem Code</option>
        </select>
        <input type="number" id="withdrawAmount" placeholder="Amount in Coins (Min 10,000)">
        <input type="text" id="upiId" placeholder="Enter UPI ID (e.g. 98765@paytm)">
        <button onclick="submitWithdrawal()">Submit Request</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx34oVlmPGOpPF-HfkylIjcFMsS0ug14mvoh4HXmecFf0mgeDYpEv3xtekYhhwS--xJ/exec";
        const ADSGRAM_BLOCK_ID = "YOUR_ADSGRAM_BLOCK_ID";
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID }) : null;

        const userId = tg?.initDataUnsafe?.user?.id || "guest_user";
        const userName = tg?.initDataUnsafe?.user?.first_name || "User";
        const COIN_KEY = "anaya_coins_" + userId;
        const TASK_KEY = "anaya_chat_task_" + userId;

        let userCoins = 0;

        // --- Coin Sync Engine ---
        function loadCoins() {
            if (tg?.CloudStorage) {
                tg.CloudStorage.getItem(COIN_KEY, (err, val) => {
                    if (!err && val !== null) {
                        userCoins = parseInt(val);
                    } else {
                        userCoins = parseInt(localStorage.getItem(COIN_KEY)) || 0;
                    }
                    updateUI();
                });
            } else {
                userCoins = parseInt(localStorage.getItem(COIN_KEY)) || 0;
                updateUI();
            }
        }

        function saveCoins(newAmount) {
            userCoins = newAmount;
            localStorage.setItem(COIN_KEY, userCoins);
            if (tg?.CloudStorage) {
                tg.CloudStorage.setItem(COIN_KEY, userCoins.toString());
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById("coins").innerText = userCoins;
        }

        // --- Canvas Wheel Setup ---
        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const segments = ["JACKPOT", "100", "LOSE", "500", "200", "1000", "100", "LOSE", "500", "200"];
        const colors = ["#e74c3c", "#f39c12", "#e74c3c", "#f39c12", "#e74c3c", "#f39c12", "#e74c3c", "#f39c12", "#e74c3c", "#f39c12"];
        let startAngle = 0;
        let isSpinning = false;

        function drawWheel() {
            const numSegs = segments.length;
            const arc = Math.PI * 2 / numSegs;
            ctx.clearRect(0, 0, 250, 250);

            for (let i = 0; i < numSegs; i++) {
                const angle = startAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(125, 125);
                ctx.arc(125, 125, 120, angle, angle + arc);
                ctx.lineTo(125, 125);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.translate(125 + Math.cos(angle + arc / 2) * 85, 125 + Math.sin(angle + arc / 2) * 85);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(segments[i], -ctx.measureText(segments[i]).width / 2, 0);
                ctx.restore();
            }
        }
        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;

            const spinRounds = 5 + Math.floor(Math.random() * 5);
            const randomDegrees = Math.floor(Math.random() * 360);
            const totalRotation = (spinRounds * 360 + randomDegrees) * (Math.PI / 180);

            const duration = 4000;
            const startTime = performance.now();

            function animateWheel(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);

                startAngle = easeOut * totalRotation;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;
                    
                    const rewards = [50, 100, 20, 10, 0];
                    const won = rewards[Math.floor(Math.random() * rewards.length)];
                    if (won > 0) {
                        saveCoins(userCoins + won);
                        alert(`🎉 Mubarak ho! Aapne ${won} Coins jeete!`);
                    } else {
                        alert("Better luck next time!");
                    }
                }
            }
            requestAnimationFrame(animateWheel);
        }

        // --- Tasks & Ads Logic ---
        function doChatTask() {
            if (localStorage.getItem(TASK_KEY)) {
                alert("Aapne yeh task pehle hi pura kar liya hai!");
                return;
            }
            window.open("https://t.me/iam_anayabot", "_blank");
            setTimeout(() => {
                localStorage.setItem(TASK_KEY, "true");
                saveCoins(userCoins + 80);
                alert("Anaya se chat karne ke liye +80 Coins add kar diye gaye hain!");
            }, 3000);
        }

        function showRewardAd() {
            if (!AdController) {
                alert("Ad Controller connect nahi hua!");
                return;
            }
            AdController.show()
            .then(() => {
                saveCoins(userCoins + 50);
                alert("Ad dekhne ke liye +50 Coins mil gaye!");
            })
            .catch(() => alert("Reward ke liye ad poora dekhein!"));
        }

        // --- Multi-Method Withdrawal Logic ---
        function updatePlaceholder() {
            const method = document.getElementById("withdrawMethod").value;
            const upiInput = document.getElementById("upiId");
            if (method === "UPI") {
                upiInput.placeholder = "Enter UPI ID (e.g. 98765@paytm)";
            } else {
                upiInput.placeholder = "Enter Phone Number / Email";
            }
        }

        function submitWithdrawal() {
            const method = document.getElementById("withdrawMethod").value;
            const amount = parseInt(document.getElementById("withdrawAmount").value);
            const details = document.getElementById("upiId").value;
            
            // 🔴 MINIMUM WITHDRAWAL LIMIT (10,000 Coins)
            const MIN_COIN_LIMIT = 10000; 

            if (!amount || !details) {
                alert("Kripya saari jankari sahi se bharein!");
                return;
            }

            // 🔴 10,000 Coins Limit Check
            if (amount < MIN_COIN_LIMIT) {
                alert(`Minimum withdrawal limit ${MIN_COIN_LIMIT.toLocaleString()} Coins hai!`);
                return;
            }

            if (amount > userCoins) {
                alert("Aapke paas paryapt coins nahi hain!");
                return;
            }

            const payload = {
                action: "withdraw",
                userId: userId,
                name: userName,
                amount: amount,
                upi: `${method}: ${details}`
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(() => {
                saveCoins(userCoins - amount);
                alert("Withdrawal request safaltapoorvak bheji gayi!");
                document.getElementById("withdrawAmount").value = "";
                document.getElementById("upiId").value = "";
            })
            .catch(() => alert("Request fail ho gayi!"));
        }

        window.onload = loadCoins;
    </script>
</body>
</html>
