<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anaya Arcade - Lucky Spin</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK Script -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; margin-bottom: 12px; }
        .header-bar h1 { font-size: 22px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .wallet-badge { background: linear-gradient(135deg, #1e293b, #334155); border: 2px solid #38bdf8; padding: 8px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-weight: bold; color: #38bdf8; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .withdraw-top-btn { background: #22c55e; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .announcement-bar { width: 100%; max-width: 500px; background: linear-gradient(90deg, #14532d, #166534); border: 1px solid #22c55e; border-radius: 10px; padding: 8px 12px; margin-bottom: 15px; }
        .announcement-text { font-size: 12px; color: #86efac; font-weight: bold; }
        .game-container { display: flex; flex-direction: column; align-items: center; background: #1e293b; padding: 20px; border-radius: 20px; max-width: 500px; width: 100%; }
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; border: 1px solid #38bdf8; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; color: white; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; }
        .submit-btn { background: #22c55e; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>🎮 Anaya Arcade</h1>
        <div class="header-right">
            <div class="wallet-badge"><span>🟡</span> <span id="walletBalance">0</span></div>
            <button class="withdraw-top-btn" onclick="openWithdrawModal()">💸 Withdraw</button>
        </div>
    </div>

    <div class="announcement-bar">
        <div class="announcement-text">✅ Withdrawal Status: ACTIVE</div>
    </div>

    <div class="game-container">
        <!-- Game Wheel remains same as your code -->
        <div class="controls">
            <button class="spin-btn" id="spinLuckyBtn" onclick="spinLuckyWheel()">Watch Ad & Spin</button>
            <div class="result" id="luckyResult">Ad dekh kar free spin karein!</div>
        </div>
    </div>

    <!-- UNLOCKED WITHDRAWAL MODAL -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-content">
            <h3>💸 Redeem Rewards</h3>
            <select id="wMethod">
                <option value="UPI">UPI Transfer</option>
                <option value="Amazon Pay">Amazon Pay Gift Card</option>
                <option value="Google Play Redeem Code">Google Play Redeem Code</option>
            </select>
            <input type="number" id="wAmount" placeholder="Points Amount (Min 500)">
            <input type="text" id="wDetails" placeholder="Enter Details (UPI/Email)">
            <button class="submit-btn" onclick="submitWithdrawal()">Submit Request</button>
            <button style="background:none; border:none; color:gray; width:100%; margin-top:10px;" onclick="closeWithdrawModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Existing Game Scripts...
        function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
        function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }
        
        function submitWithdrawal() {
            const method = document.getElementById('wMethod').value;
            const amount = parseInt(document.getElementById('wAmount').value);
            const details = document.getElementById('wDetails').value.trim();
            
            if (amount < 500) { alert("Min 500 points!"); return; }
            
            // Send data to your bot
            if (window.Telegram.WebApp) {
                window.Telegram.WebApp.sendData(JSON.stringify({
                    type: "withdraw",
                    method: method,
                    amount: amount,
                    details: details
                }));
            }
            alert("Request sent to Admin!");
            closeWithdrawModal();
        }
    </script>
</body>
</html>
